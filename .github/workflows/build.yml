name: Build SP970 OpenWrt + daed + Docker (BTF) [v2 no-passwall]

# 云端完整编译：克隆官方 OpenWrt 25.12.x → apply_patches(wcn36xx) → 挂 msm89xx target
# → 应用 BTF 内核 config → 加 daed/Passwall feed → 增量包(daed+passwall+docker) → 编 uz801 镜像。
# 保留 hkfuertes 原作者全部功能（luci/modemmanager/wireguard/usb-gadget/zram/wcn36xx WiFi）。
# 产物：可刷到 SP970(SP970-B-V5) 的固件（借用 yiming-uz801v3 定义，cmdline 与 SP970 实测一致）。

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备（uz801=SP970借用刷入）'
        default: uz801
        type: choice
        options: [uz801, uf02]
  push:
    branches: [ master ]

env:
  TZ: Asia/Shanghai
  UPSTREAM: https://github.com/hkfuertes/msm8916-openwrt.git

jobs:
  resolve-version:
    runs-on: ubuntu-22.04
    outputs:
      openwrt_version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        run: |
          V=$(git ls-remote --tags https://git.openwrt.org/openwrt/openwrt.git 'v25.12.*' \
            | grep -oP 'v25\.12\.\d+$' | sort -V | tail -1)
          [ -z "$V" ] && { echo "无法解析 OpenWrt 25.12.x"; exit 1; }
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "解析到 $V"

  build:
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 本仓库（拿 config/scripts overlay）
        uses: actions/checkout@v4
        with: { path: overlay }

      - name: 清盘 + 装依赖
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          echo "=== 清盘前 ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/lib/node_modules /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/microsoft /usr/lib/google-cloud-sdk /usr/lib/jvm 2>/dev/null || true
          sudo apt-get -qq purge -y '^dotnet-.*' '^llvm-1[0-9].*' azure-cli \
                      google-chrome-stable firefox powershell mono-devel 2>/dev/null || true
          sudo apt-get -qq autoremove -y 2>/dev/null || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile || true
          sudo mkdir -p /mnt/gh-build
          sudo chown "$USER:$USER" /mnt/gh-build
          echo "=== 清盘后 ==="; df -h / /mnt

      - name: 克隆上游 msm8916-openwrt
        run: git clone --depth=1 "$UPSTREAM" up

      - name: 装编译依赖
        run: |
          sudo -E apt-get -qq update
          sudo -E ./up/devenv/dependencies.sh
          sudo add-apt-repository -y universe 2>/dev/null || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y clang-14 llvm-14 lld-14
          sudo -E apt-get -qq install -y dwarves || sudo -E apt-get -qq install -y pahole
          echo "--- pahole 版本自检（BTF 编码硬需求）---"
          command -v pahole && pahole --version || { echo "!! FATAL: pahole 未装上，vmlinux-btf 编码会失败"; exit 1; }
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/llc-14 /usr/bin/llc
          sudo ln -sf /usr/bin/llvm-dis-14 /usr/bin/llvm-dis
          sudo ln -sf /usr/bin/opt-14 /usr/bin/opt
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          echo "clang 版本：$(clang --version | head -1)"
          sudo timedatectl set-timezone "$TZ" || true

      - name: 克隆官方 OpenWrt
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git /mnt/gh-build/openwrt
          ln -sfn /mnt/gh-build/openwrt openwrt
          git -C openwrt checkout ${{ needs.resolve-version.outputs.openwrt_version }}
          df -h / /mnt

      - name: 硬 patch include/bpf.mk（把 /invalid/ 兜底路径改成真 clang，绕过 config choice）
        run: |
          cd openwrt
          echo "--- patch 前 bpf.mk 里的 /invalid 出现处 ---"
          grep -n "/invalid" include/bpf.mk || echo "(无 /invalid，可能上游改了写法)"
          sed -i -E 's#^([[:space:]]*LLVM_PATH[[:space:]]*:?=).*#\1/usr/bin#' include/bpf.mk
          sed -i 's#/invalid/#/usr/bin/#g; s#/invalid#/usr/bin#g' include/bpf.mk
          echo "--- patch 后 ---"
          grep -n "LLVM_PATH\|/usr/bin/clang\|/usr/bin/llvm\|/invalid" include/bpf.mk || true
          if grep -q '/invalid' include/bpf.mk; then
            echo "!! FATAL: patch 后 bpf.mk 仍残 /invalid"; grep -n '/invalid' include/bpf.mk; exit 1
          fi
          /usr/bin/clang --version | head -1

      - name: 挂 msm89xx target + apply_patches(wcn36xx) + 应用 BTF config
        run: |
          chmod +x up/apply_patches.sh
          ./up/apply_patches.sh openwrt
          ( cd up && /bin/sh "$GITHUB_WORKSPACE/overlay/scripts/apply-daed-config.sh" )
          MK=up/msm89xx/image/msm8916.mk
          echo "=== 改造前 msm8916.mk Device/msm8916 ==="; sed -n '/define Device\/msm8916/,/^endef/p' "$MK"
          sed -i 's#root=/dev/mmcblk0p14 rootfstype=squashfs rootwait#root=/dev/mmcblk0p14 rootfstype=ext4 rw rootwait#' "$MK"
          sed -i 's/^  FEATURES := squashfs/  FEATURES := ext4/' "$MK"
          sed -i 's/^  FILESYSTEMS := squashfs/  FILESYSTEMS := ext4/g' "$MK"
          sed -i 's#^  IMAGE/system.img := append-rootfs | append-metadata#  IMAGE/system.img := append-rootfs | pad-to 64k | append-metadata#' "$MK"
          sed -i 's/^  ARTIFACTS := squashfs-gpt_both0.bin flash.sh firmware.zip/  ARTIFACTS := flash.sh firmware.zip/' "$MK"
          sed -i '/^  ARTIFACT\/squashfs-gpt_both0.bin := generate-squashfs-gpt/d' "$MK"
          echo "=== 改造后 msm8916.mk Device/msm8916 ==="; sed -n '/define Device\/msm8916/,/^endef/p' "$MK"
          echo "=== 确认 uz801 Device FILESYSTEMS ==="; sed -n '/define Device\/yiming-uz801v3/,/^endef/p' "$MK"
          mv up/msm89xx  openwrt/target/linux/msm89xx
          mv up/packages openwrt/package/msm8916

      - name: 先装官方 feed（daed/daede 的 Makefile 会 include feeds/packages/lang/golang）
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加 daed / Argon / iStore feed
        run: |
          cd openwrt
          cat >> feeds.conf.default <<'EOF'
          src-git daede https://github.com/kenzok8/openwrt-daede
          src-git istore https://github.com/linkease/istore-ui.git
          src-git argon https://github.com/jerrykuku/luci-theme-argon.git
          EOF
          ./scripts/feeds update daede istore argon
          ./scripts/feeds install -p daede daed luci-app-daede vmlinux-btf || true
          ./scripts/feeds install luci-app-store luci-theme-argon luci-app-argon-config luci-app-frpc luci-i18n-base-zh-cn || true

      - name: 生成 .config（uz801 基线 + 增量包）
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/up/diffconfig_uz801" .config 2>/dev/null || cp ../up/diffconfig_uz801 .config
          /bin/sh "$GITHUB_WORKSPACE/overlay/scripts/apply-daed-config.sh" "$PWD"
          make defconfig
          sed -i -e '/CONFIG_BPF_TOOLCHAIN_/d' -e '/CONFIG_USE_LLVM_/d' -e '/CONFIG_DEVEL[= ]/d' .config
          cat >> .config <<'EOF'
          CONFIG_DEVEL=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_USE_LLVM_HOST=y
          CONFIG_BPF_TOOLCHAIN_HOST_PATH=""
          # CONFIG_BPF_TOOLCHAIN_BUILD_LLVM is not set
          # CONFIG_BPF_TOOLCHAIN_PREBUILT is not set
          # CONFIG_BPF_TOOLCHAIN_NONE is not set
          EOF
          make defconfig
          sed -i -e '/CONFIG_TARGET_ROOTFS_EXT4FS/d' -e '/CONFIG_TARGET_ROOTFS_SQUASHFS/d' -e '/CONFIG_TARGET_ROOTFS_PARTSIZE/d' .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          EOF
          make defconfig
          sed -i -e '/CONFIG_TARGET_ROOTFS_PARTSIZE/d' .config
          echo 'CONFIG_TARGET_ROOTFS_PARTSIZE=512' >> .config
          make defconfig
          echo "=== ext4 rootfs 分区尺寸确认（须 =512）==="
          grep -E 'CONFIG_TARGET_ROOTFS_PARTSIZE' .config || true
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=512' .config \
            || { echo "!! FATAL: PARTSIZE 未固化为 512，ext4 rootfs 仍会 out of space"; exit 1; }
          echo "=== 根文件系统选择确认（须 EXT4FS=y）==="
          grep -E 'CONFIG_TARGET_ROOTFS_EXT4FS|CONFIG_TARGET_ROOTFS_SQUASHFS' .config || true
          grep -q '^CONFIG_TARGET_ROOTFS_EXT4FS=y' .config \
            || { echo "!! FATAL: EXT4FS 根未启用，image.mk 不会生成 <device>-images 目标"; exit 1; }
          echo "=== BPF 工具链选择确认 ==="
          grep -E "BPF_TOOLCHAIN|USE_LLVM|CONFIG_DEVEL" .config || true
          grep -q '^CONFIG_USE_LLVM_HOST=y' .config \
            && echo "[ok] USE_LLVM_HOST 已生效（二重保险）" \
            || echo "[warn] USE_LLVM_HOST 未生效，依赖第74步 bpf.mk 源码 patch 兵底（已将 /invalid/ 改为 /usr/bin/）"
          grep -q '/invalid' include/bpf.mk \
            && { echo "!! FATAL: bpf.mk 仍残 /invalid，第74步 patch 未生效"; grep -n '/invalid' include/bpf.mk; exit 1; } \
            || echo "[ok] bpf.mk 已无 /invalid 残留"
          command -v clang && clang --version | head -1 || { echo "!! clang 不在 PATH"; exit 1; }
          echo "=== 关键包/内核项确认 ==="
          grep -E "DEBUG_INFO_BTF=y|NET_SCHED=y|PACKAGE_daed=y|PACKAGE_dockerd=y" .config || true
          echo "=== 确认 Passwall 已移除（应无输出）==="
          grep -E "luci-app-passwall=y|passwall_packages_xray|passwall_packages_sing-box" .config && echo "!! WARN: Passwall 残留" || echo "[ok] 无 Passwall"

      - name: 下载源码包
        run: cd openwrt && make download -j8 && find dl -size -1024c -exec rm -f {} \; || true

      - name: 编译
        run: |
          cd openwrt
          echo "$(nproc) 线程编译"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "FILE_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: 收集固件
        id: org
        run: |
          cd openwrt/bin/targets/*/* && rm -rf packages
          echo "FW=$PWD" >> $GITHUB_ENV
          ls -la

      - name: 上传固件 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp970-daed-docker-${{ needs.resolve-version.outputs.openwrt_version }}-${{ env.FILE_DATE }}
          path: |
            ${{ env.FW }}/openwrt-msm89xx-*-ext4-boot.img*
            ${{ env.FW }}/openwrt-msm89xx-*-ext4-system.img*
            ${{ env.FW }}/openwrt-msm89xx-*-ext4-sysupgrade.bin*
            ${{ env.FW }}/openwrt-msm89xx-*-flash.sh
            ${{ env.FW }}/openwrt-msm89xx-*-firmware.zip
            ${{ env.FW }}/openwrt-msm89xx-*.manifest
          if-no-files-found: error
